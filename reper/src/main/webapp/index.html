<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSauron - Reper Service</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background-color: white;
            padding: 2rem 4rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: #7f8c8d;
        }

        .status-icon {
            font-size: 3rem;
            color: #27ae60;
            margin-bottom: 1rem;
        }

        #endpoints-list {
            list-style-type: none;
            padding: 0;
            max-height: 50vh;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        #endpoints-list::-webkit-scrollbar {
            width: 8px;
        }

        #endpoints-list::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #endpoints-list::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        #endpoints-list::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="status-icon">✓</div>
        <h1>Application Running</h1>
        <p>The QSauron Reper service is up and running correctly.</p>

        <div id="loading">Loading endpoints...</div>
        <div id="endpoints-container" style="display:none; margin-top: 2rem; text-align: left;">
            <h2>Available Endpoints</h2>
            <ul id="endpoints-list">
                <!-- Endpoints will be injected here -->
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const list = document.getElementById('endpoints-list');
            const container = document.getElementById('endpoints-container');
            const loading = document.getElementById('loading');
            let path = window.location.pathname;
            path = path.replace('/index.html', '');
            if (path.endsWith('/')) {
                path = path.slice(0, -1);
            }
            const base = window.location.origin + path;

            fetch(base + '/system/endpoints')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    loading.style.display = 'none';
                    container.style.display = 'block';

                    if (data.length === 0) {
                        list.innerHTML = '<li>No endpoints found.</li>';
                        return;
                    }

                    // Sort endpoints by path
                    data.sort((a, b) => a.path.localeCompare(b.path));

                    data.forEach(endpoint => {
                        const li = document.createElement('li');
                        li.style.background = '#f9f9f9';
                        li.style.margin = '0.5rem 0';
                        li.style.padding = '1rem';
                        li.style.borderRadius = '5px';
                        li.style.border = '1px solid #ddd';

                        const method = endpoint.methods.join(', ');
                        const fullUrl = base + endpoint.path;

                        li.innerHTML = `
                            <div style="font-weight: bold; color: #3498db;">${method} <span style="color: #333;">${endpoint.path}</span></div>
                            <div style="font-size: 0.9rem; color: #7f8c8d; margin-top: 5px;">
                                <a href="${fullUrl}" target="_blank" style="color: #7f8c8d; text-decoration: none;">${fullUrl}</a>
                            </div>
                        `;
                        list.appendChild(li);
                    });
                })
                .catch(error => {
                    loading.textContent = 'Error loading endpoints: ' + error.message;
                    loading.style.color = 'red';
                });
        });
    </script>
</body>

</html>
