spring.application.name=qsauron

server.port = 8080

spring.datasource.url = jdbc:mysql://172.20.48.23:3306/qsauron?serverTimezone=UTC&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&maxAllowedPacket=134217728
spring.datasource.username =ideas
spring.datasource.password =ideas123

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

app.cors.allowed-origins=*

app.alaride.url=https://alarcosj.esi.uclm.es/alaride

# Graceful shutdown to prevent Tomcat memory leaks (Catalina-utility-1)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.mutantanalytics.url=http://192.168.229.4:8503/

# Tamaño máximo permitido para un solo archivo
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo permitido para la petición completa (archivos + datos)
spring.servlet.multipart.max-request-size=15MB
# Microservices URLs
app.qumugen.url=https://alarcosj.esi.uclm.es/qumugen
app.qiskitexec.url=https://alarcosj.esi.uclm.es/qiskitexec
app.qiskitexec.batch-size=32
app.qiskitexec.max-programs-per-request=128
# = RUN_CODE_ASYNC_WORKERS del remote_runner (W). Si el runner cambia de máquina, ajústalo
app.qiskitexec.runner-workers=8
app.qiskitexec.target-request-seconds=300
# tope de espera de un trabajo de qiskitexec
app.qiskitexec.read-timeout-seconds=3600
# cada cuánto reper consulta el estado de un trabajo de qiskitexec (debe ser << jobs.orphan-timeout-seconds de qiskitexec, 120 s)
app.qiskitexec.poll-interval-ms=3000
app.converter.url=${APP_CONVERTER_URL:http://localhost:8081}

# Mail Configuration (Brevo API)
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.sender.email=qsauron.noreply@gmail.com
brevo.sender.name=QSauron

# Import & Converter Configuration
app.qconvert.url=${APP_QCONVERT_URL:https://alarcosj.esi.uclm.es/qconvert}
app.qconvert.timeout-seconds=60
app.import.max-files=20
app.import.max-file-bytes=524288
app.import.max-total-bytes=5242880
app.import.max-request-bytes=6291456
app.import.max-qubits=16

