spring.datasource.url = jdbc:mysql://localhost:3306/qsauron
spring.datasource.username = root
spring.datasource.password =pass

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#app.cors.allowed-origins=https://alarcosj.esi.uclm.es
app.cors.allowed-origins=*

app.alaride.url=http://localhost:81

app.mutantanalytics.url=http://localhost:8503

# Tamaño máximo permitido para un solo archivo
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo permitido para la petición completa (archivos + datos)
spring.servlet.multipart.max-request-size=15MB

# Microservices URLs
app.qumugen.url=${APP_QUMUGEN_URL:http://localhost:8500}
app.qiskitexec.url=${APP_QISKITEXEC_URL:http://localhost:8502}
app.qiskitexec.batch-size=${APP_QISKITEXEC_BATCH_SIZE:32}
app.qiskitexec.max-programs-per-request=128
app.qiskitexec.read-timeout-seconds=900
app.converter.url=${APP_CONVERTER_URL:http://localhost:8081}

# Mail Configuration (Brevo API)
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.sender.email=qsauron.noreply@gmail.com
brevo.sender.name=QSauron
