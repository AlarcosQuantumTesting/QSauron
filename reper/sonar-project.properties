# Must be unique in a given SonarQube instance
sonar.host.url=http://localhost:9000/
sonar.projectKey=QSauron-backend
sonar.token=squ_24b67da80545c00153bcaf9dcdd50d1cefaca94f

# This is the name and version displayed in the SonarQube UI.
sonar.projectName=QSauron-backend
sonar.projectVersion=1.0.0

# Exclusions for files that should not be analyzed
sonar.exclusions=**/test/**, **/tests/**, **/resources/**, **/config/**, **/dto/**

# Source directories (REQUERIDO)
sonar.sources=src/main/java
sonar.tests=src/test/java

# Encoding of the source code
sonar.sourceEncoding=UTF-8
sonar.java.binaries=target/classes

# Pointer to test coverage file 
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
